name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Face models for the identity check (SHA-256 pinned), cached
        uses: actions/cache@v4
        with:
          path: models/vision
          key: vision-models-${{ hashFiles('scripts/fetch-vision-models.mjs') }}
      - run: npm run vision:models
      - run: npm run vision:selftest
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Sample data is reproducible (checksums in docs/SAMPLE-DATA.md)
        run: npm run samples:check
      - run: npm run build
      - name: Dependency audit (fails on high/critical, dev deps included)
        run: npm audit --audit-level=high
      - name: Browser tests (production build, isolated DB, stand-in vault fixture; no testnet)
        run: |
          npx playwright install --with-deps chromium
          echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm run test:e2e
      - name: Judge mode (fresh demo DB, no signer keys)
        run: npm run test:judge-mode
      - name: Hosted demo mode, then the kill switch (no admin key; reads testnet history read-only)
        run: npm run test:hosted

  image:
    # The hosted demo image, built exactly as Railway builds it (root Dockerfile), on GitHub's
    # runner. Never on the development server (no Docker there). Nothing is pushed or deployed.
    name: Hosted image (build, boot in hosted demo mode, restart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t sentfund-hosted .
      - name: Boot with HOSTED_DEMO=true and check health, banner and logs
        run: |
          # Throwaway worker key: random, never added to any account, so it can sign nothing.
          key=$(docker run --rm sentfund-hosted node -e "import('near-api-js').then(({KeyPair})=>console.log(KeyPair.fromRandom('ed25519').toString()))")
          echo "::add-mask::$key"
          docker volume create sentfund-data
          docker run -d --name sentfund -p 127.0.0.1:8080:8080 -v sentfund-data:/data \
            -e SESSION_SECRET="$(openssl rand -hex 32)" -e DEMO_MODE=true -e HOSTED_DEMO=true \
            -e APP_BASE_URL=http://127.0.0.1:8080 -e WORKER_ACCOUNT_ID=worker.gajian-payroll.testnet \
            -e WORKER_SIGNER_PRIVATE_KEY="$key" sentfund-hosted
          ok=
          for i in $(seq 1 90); do
            if curl -fsS -o health.json http://127.0.0.1:8080/api/health; then ok=1; break; fi
            sleep 2
          done
          docker logs sentfund > boot.log 2>&1
          cat boot.log
          test -n "$ok"
          cat health.json
          grep -q '"db":"ok"' health.json
          grep -q '"hostedDemo":true' health.json
          grep -q '"faceModels":true' health.json
          curl -fsS -o landing.html http://127.0.0.1:8080/
          grep -q 'data-testid="hosted-banner"' landing.html
          grep -q '"event":"demo_reset_done"' boot.log
          grep -q '"service":"hosted-start","event":"started"' boot.log
      - name: SIGTERM stops both processes cleanly; second boot runs migrations only
        run: |
          docker stop -t 30 sentfund
          test "$(docker inspect -f '{{.State.ExitCode}}' sentfund)" = 0
          docker start sentfund
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:8080/api/health && break; sleep 2; done
          curl -fsS -o health.json http://127.0.0.1:8080/api/health
          grep -q '"db":"ok"' health.json
          docker logs sentfund > boot.log 2>&1
          grep -q '"event":"migrations_applied"' boot.log
          test "$(grep -c '"event":"demo_reset_done"' boot.log)" = 1
      - name: If the worker dies, the service stops non-zero
        run: |
          docker exec sentfund sh -c 'for p in /proc/[0-9]*; do grep -qs "src/worker/index[.]ts" "$p/cmdline" && kill -TERM "${p#/proc/}"; done; true'
          for i in $(seq 1 30); do test "$(docker inspect -f '{{.State.Running}}' sentfund)" = false && break; sleep 1; done
          test "$(docker inspect -f '{{.State.Running}}' sentfund)" = false
          test "$(docker inspect -f '{{.State.ExitCode}}' sentfund)" != 0
          docker logs sentfund 2>&1 | tail -n 5

  secrets:
    name: Credential scan (working tree + full Git history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sh scripts/secret-scan.sh

  contracts:
    name: Contracts (fmt, clippy, unit + sandbox tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain (contracts/rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: Install cargo-near 0.23.0
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.23.0/cargo-near-installer.sh | sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
